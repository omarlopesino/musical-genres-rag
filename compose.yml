services:
  db:
    image: pgvector_textsearch
    build: ./
    container_name: ${PROJECT_NAME}_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: musical_genres
    ports:
      - "5432:5432"
    volumes:
      - mgr_pgdata:/var/lib/postgresql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql

volumes:
  mgr_pgdata:
