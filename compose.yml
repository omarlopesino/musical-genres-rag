services:
  db:
    image: pgvector_textsearch
    build: ./
    container_name: ${PROJECT_NAME}_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: musical_genres
    ports:
      - "5432:5432"
    volumes:
      - mgr_pgdata:/var/lib/postgresql
      # Init scripts run in alphabetical order: schema, then seed data.
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./data/load.sql:/docker-entrypoint-initdb.d/02-load.sql
      - ./data:/data:ro

volumes:
  mgr_pgdata:
