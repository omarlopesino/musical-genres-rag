services:
  db:
    container_name: ${PROJECT_NAME}_db
    image: pgvector_textsearch
    build: ./
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: musical_genres
    ports:
      - "5432:5432"
    volumes:
      - mgr_pgdata:/var/lib/postgresql
      # Django migrations own the schema now, so nothing runs at init. The CSVs stay
      # mounted because load.sql COPYs them server-side, from inside this container.
      - ./data:/data:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d musical_genres"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    container_name: ${PROJECT_NAME}_redis
    image: redis:8.8.1
    ports:
      - "6379:6379"

  # The chat and the evaluation reports, served here rather than started by hand so the report URL
  # an Airflow run links to keeps resolving. The Dockerfile in this repository builds the database
  # image, so this runs the stock uv image over the sources instead of adding a second one to maintain.
  ui:
    container_name: ${PROJECT_NAME}_ui
    image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
    working_dir: /app
    command: uv run streamlit run ui.py --server.address 0.0.0.0 --server.port 8501
    env_file: .env
    # settings.py loads .env without overriding, so these win over the values the host reaches
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: redis
    volumes:
      - ./:/app
      # Without this the bind mount above hands the container the virtualenv built for the host
      - mgr_ui_venv:/app/.venv
    ports:
      - "8501:8501"
    depends_on:
      db:
        condition: service_healthy

  # The Django application itself, serving the JSON API an orchestrator drives it by and whatever
  # else it comes to do. Runs from the repository root because the ground truth and its answers are
  # written to, and read back from, paths relative to it. Autoreload is off: a reload would take
  # with it whatever task was running in a thread of this process.
  app:
    container_name: ${PROJECT_NAME}_app
    image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
    working_dir: /app
    command: uv run python manage.py runserver --noreload 0.0.0.0:8000
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: redis
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,app
      # The link a finished evaluation is handed back as, read by whoever called the API rather
      # than from inside this network, so it names the port the ui is published on.
      UI_BASE_URL: http://localhost:8501
      # The same, for the files the ground truth and its answers are downloaded from: this very
      # service, named as it is published rather than as it is reached from inside the network.
      API_BASE_URL: http://localhost:8000
    volumes:
      - ./:/app
      - mgr_app_venv:/app/.venv
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      # Where the progress of a running task is written, so a caller polling it reads what another
      # process wrote
      redis:
        condition: service_started

  # The orchestrator, as a single container: `airflow standalone` runs the api server, the scheduler,
  # the dag processor and the triggerer in one process group, over a SQLite metadata database kept in
  # the volume below. That is the development layout Airflow documents, and it is enough for dags that
  # do their work by calling the app over HTTP rather than in a worker of their own.
  airflow:
    container_name: ${PROJECT_NAME}_airflow
    image: apache/airflow:3.3.0
    command: standalone
    environment:
      # No login: the simple auth manager waves everyone through as admin. It is what keeps this from
      # needing the password it would otherwise generate into the volume and expect to be read back.
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"
      # Only the dags in ./dags, so the tutorial's is the one thing listed
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      # The connection the dags reach the app by, defined here rather than as a row in the metadata
      # database so it exists on a fresh volume without anyone adding it through the UI. The host is
      # the service name: from inside this network the app does not answer on localhost.
      AIRFLOW_CONN_MUSICAL_GENRES_RAG: "http://app:8000"
    volumes:
      # Metadata database, logs and airflow.cfg, kept across restarts of the container
      - mgr_airflow_home:/opt/airflow
      - ./dags:/opt/airflow/dags:ro
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      # First boot migrates the metadata database before anything answers
      start_period: 90s

  # The dashboard over live traffic, reading the same database the chat writes its conversations to.
  # Its data source and its dashboards are provisioned out of this repository, so a fresh volume comes
  # up already wired rather than waiting for somebody to fill a form in.
  grafana:
    container_name: ${PROJECT_NAME}_grafana
    image: grafana/grafana:12.3.0
    env_file: .env
    environment:
      # The provisioned data source names the database by these, and from inside this network it is
      # not the host the .env reaches
      POSTGRES_HOST: db
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      # Whatever is built through the UI, kept across restarts of the container
      - mgr_grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mgr_pgdata:
  mgr_ui_venv:
  mgr_app_venv:
  mgr_airflow_home:
  mgr_grafana_data:
