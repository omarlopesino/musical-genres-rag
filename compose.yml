services:
  db:
    container_name: ${PROJECT_NAME}_db
    image: pgvector_textsearch
    build: ./
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: musical_genres
    ports:
      - "5432:5432"
    volumes:
      - mgr_pgdata:/var/lib/postgresql
      # Django migrations own the schema now, so nothing runs at init. The CSVs stay
      # mounted because load.sql COPYs them server-side, from inside this container.
      - ./data:/data:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d musical_genres"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    container_name: ${PROJECT_NAME}_redis
    image: redis:8.8.1
    ports:
      - "6379:6379"

volumes:
  mgr_pgdata:
