[project]
name = "musical-genres-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2",
    "django-ninja>=1.4.0",
    "django-redis>=6.0.0",
    "dotenv>=0.9.9",
    # Fetches the embedding weights, which are two files on the hub rather than a package
    "huggingface-hub>=0.36.0",
    # Arrives with pandas anyway, declared because the vectorizer pools and normalises with it
    "numpy>=2.4.0",
    "openai>=2.48.0",
    # The embedding model runs here rather than behind a paid call, on the cpu
    "onnxruntime>=1.24.0",
    "pandas>=3.0.5",
    # The vector column of the index, as a field the model can declare
    "pgvector>=0.4.1",
    # The binary wheel carries its own libpq, so the ui image needs no system package
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-evals>=2.18.0",
    # Arrives with pydantic-evals anyway, declared because config.yml is read directly with it
    "pyyaml>=6.0.3",
    "redis>=8.0.1",
    "streamlit>=1.60.0",
    # Arrives with pydantic-ai anyway, declared because the retry policy imports it directly
    "tenacity>=9.0.0",
    # What the model was trained to read text as, shipped beside the weights as tokenizer.json
    "tokenizers>=0.22.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/musical_genres_rag", "src/config"]
