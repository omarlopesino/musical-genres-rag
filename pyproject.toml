[project]
name = "musical-genres-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2",
    "django-redis>=6.0.0",
    "dotenv>=0.9.9",
    "openai>=2.48.0",
    "pandas>=3.0.5",
    # The binary wheel carries its own libpq, so the ui image needs no system package
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-evals>=2.18.0",
    "redis>=8.0.1",
    "streamlit>=1.60.0",
    # Arrives with pydantic-ai anyway, declared because the retry policy imports it directly
    "tenacity>=9.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/musical_genres_rag", "src/config"]
