[project]
name = "musical-genres-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "psycopg>=3.3.4",
    "redis>=8.0.1",
]

[project.scripts]
debug = 'musical_genres_rag.debug:debug'
ingest = 'musical_genres_rag.cli:ingest'
rag = 'musical_genres_rag.cli:rag'

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/musical_genres_rag"]
