[project]
name = "musical-genres-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2",
    "django-redis>=6.0.0",
    "dotenv>=0.9.9",
    "openai>=2.48.0",
    "pandas>=3.0.5",
    "psycopg>=3.3.4",
    "pydantic>=2.13.4",
    "redis>=8.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/musical_genres_rag", "src/config"]
